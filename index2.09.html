<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Difficulty Selection - Glam Rock Edition</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center font-sans">

<h1 class="text-5xl font-black mb-16 tracking-tighter uppercase italic text-transparent bg-clip-text bg-gradient-to-b from-yellow-400 to-orange-600 drop-shadow-[0_5px_15px_rgba(234,179,8,0.4)]">
Elige tu Dificultad
</h1>

<div class="flex gap-8">

<div class="bg-green-500 text-slate-950 p-10 rounded-2xl font-black text-2xl uppercase tracking-tighter hover:-translate-y-2 hover:bg-green-400 transition-all cursor-pointer shadow-[0_10px_0_rgb(21,128,61)] active:translate-y-0 active:shadow-none">
Fácil 🟢
</div>

<div class="bg-yellow-500 text-slate-950 p-10 rounded-2xl font-black text-2xl uppercase tracking-tighter hover:-translate-y-2 hover:bg-yellow-400 transition-all cursor-pointer shadow-[0_10px_0_rgb(161,98,7)] active:translate-y-0 active:shadow-none">
Normal 🟡
</div>

<div class="bg-red-600 text-white p-10 rounded-2xl font-black text-2xl uppercase tracking-tighter hover:-translate-y-2 hover:bg-red-500 transition-all cursor-pointer shadow-[0_10px_0_rgb(153,27,27)] active:translate-y-0 active:shadow-none">
Difícil 🔴
</div>

</div>

</body>
</html>
