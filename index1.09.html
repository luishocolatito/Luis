<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Player Card - Glam Rock Edition</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>

<body class="bg-gray-100 dark:bg-gray-950 min-h-screen flex items-center justify-center font-sans transition-colors duration-500">

  <div class="bg-white border-l-8 border-fuchsia-600 p-6 rounded-2xl shadow-xl w-full max-w-md dark:bg-gray-900 dark:border-cyan-400 flex flex-col gap-4">

    <div class="flex items-center gap-4">

      <div class="bg-gradient-to-tr from-fuchsia-500 to-cyan-400 w-16 h-16 rounded-full shadow-lg"></div>

      <div class="text-left">
        <h3 class="font-black text-xl uppercase italic text-gray-900 dark:text-white">
          PLAYER ONE
        </h3>

        <p class="text-gray-500 dark:text-gray-400 text-sm font-medium">
          NIVEL 42 • PRO PLAYER
        </p>
      </div>

    </div>

    <button class="bg-fuchsia-600 hover:bg-fuchsia-500 text-white dark:bg-green-500 dark:hover:bg-green-400 dark:text-gray-900 px-5 py-2 rounded-full font-black uppercase text-xs tracking-widest transition-all transform hover:scale-105 shadow-lg">
      ⚡ Agregar
    </button>

  </div>

</body>
</html>
